server:
  port: ${RESUME_DO_API_PORT:8080}
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: false

spring:
  profiles:
    default: prod
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
      file-size-threshold: 0
  application:
    name: resume-do
  output:
    ansi:
      enabled: always
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

app:
  download-ttl-minutes: ${RESUME_DO_DOWNLOAD_TTL_MINUTES:10}
  template-version: 2
  renderer-version: "2"

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){cyan} %clr(%-5level) %clr([%thread]){magenta} %clr(%logger{36}){blue} %clr(>){faint} %msg%n%wEx"
  level:
    root: INFO
    com.resumedo: INFO
