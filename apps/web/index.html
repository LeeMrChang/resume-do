<!doctype html>
<html lang="zh-CN" data-theme="dark" data-theme-preference="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Resume Do · 简历工作台</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('resume-do:theme');
          var preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'dark';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = preference;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
