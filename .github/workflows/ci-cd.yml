name: Resume Do CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 'Build and deploy all services (first release / baseline recovery)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Detect affected services
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.base.outputs.sha }}
      any: ${{ steps.plan.outputs.any }}
      services: ${{ steps.plan.outputs.services }}
      integration: ${{ steps.plan.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == pull_request ]]; then
            base=$(git merge-base HEAD origin/main)
          else
            # Include accumulated changes from failed/skipped releases, not only HEAD^.
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-cd.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          fi
          if [[ -n "$base" ]] && ! git merge-base --is-ancestor "$base" HEAD; then base=''; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          BASE: ${{ steps.base.outputs.sha }}
          FULL: ${{ inputs.full || false }}
        run: |
          args=()
          if [[ "$FULL" == true ]]; then args+=(--full); fi
          python3 scripts/plan-release.py --base "$BASE" "${args[@]}" --output "$RUNNER_TEMP/plan.json"

  safety:
    name: Deployment safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/ci-cd.yml

  service:
    name: Check ${{ matrix.service }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.service == 'api'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: matrix.service == 'api'
        run: mvn -B verify -f apps/api/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: matrix.service != 'api'
        with:
          node-version: '22'
          cache: npm
      - if: matrix.service != 'api'
        env:
          SERVICE: ${{ matrix.service }}
          RESUME_DO_BROWSER_CHANNEL: chromium
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck -w @resume-do/schema -w @resume-do/templates
          npm test -w @resume-do/schema -w @resume-do/templates
          npx playwright install --with-deps chromium
          if [[ "$SERVICE" == web ]]; then
            npm run typecheck -w @resume-do/web
            npm test -w @resume-do/web
            npm run build
            npm run test:e2e
          else
            npm run typecheck -w @resume-do/pdf-worker
            npm test -w @resume-do/pdf-worker
            npm run test:pdf -w @resume-do/pdf-worker
          fi

  integration:
    name: API, migrations and PDF integration
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only-password
          MYSQL_DATABASE: resume_do
          MYSQL_USER: resume_do
          MYSQL_PASSWORD: ci-app-only-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="MYSQL_PWD=ci-app-only-password mysql --protocol=tcp -h127.0.0.1 -uresume_do -Dresume_do -e 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare integration dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          mvn -B -DskipTests package -f apps/api/pom.xml
      - name: Isolated API, Flyway and queued PDF smoke test
        env:
          RESUME_DO_DB_HOST: 127.0.0.1
          RESUME_DO_DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          RESUME_DO_DB_PASSWORD: ci-app-only-password
          RESUME_DO_STORAGE_DIR: ${{ runner.temp }}/resume-do-smoke
          RESUME_DO_BROWSER_CHANNEL: chromium
          RESUME_DO_AI_ENABLED: 'false'
          SPRING_PROFILES_ACTIVE: prod
        run: |
          set -euo pipefail
          java -jar apps/api/target/resume-api-0.1.0.jar > "$RUNNER_TEMP/resume-api.log" 2>&1 &
          api_pid=$!
          node --import tsx scripts/dev-worker.mjs > "$RUNNER_TEMP/resume-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for ((attempt=0; attempt<90; attempt++)); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            tail -n 80 "$RUNNER_TEMP/resume-api.log"
            exit 1
          fi
          # Registration needs a captcha and a mailed code, so seed one code row in this disposable DB.
          email="ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.invalid"
          printf "INSERT INTO verification_codes (channel, target, purpose, code_hash, expires_at, request_ip) VALUES ('email', '%s', 'register', '%s', NOW(3) + INTERVAL 15 MINUTE, '127.0.0.1');\n" \
            "$email" "$(python3 scripts/generate-code-hash.py)" > "$RUNNER_TEMP/seed.sql"
          docker run --rm --network host -i -e MYSQL_PWD=ci-app-only-password mysql:8.4 \
            mysql --protocol=tcp -h127.0.0.1 -P"$RESUME_DO_DB_PORT" -uresume_do -Dresume_do < "$RUNNER_TEMP/seed.sql"
          if ! python3 scripts/smoke-cloud.py --base http://127.0.0.1:8080 --email "$email" --code 123456; then
            tail -n 80 "$RUNNER_TEMP/resume-api.log" "$RUNNER_TEMP/resume-worker.log"
            exit 1
          fi

  checks:
    # Stable required-check name for existing branch protection.
    name: Tests, build and isolated integration
    needs: [plan, safety, service, integration]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          SAFETY: ${{ needs.safety.result }}
          SERVICE: ${{ needs.service.result }}
          INTEGRATION: ${{ needs.integration.result }}
          ANY: ${{ needs.plan.outputs.any }}
          NEED_INTEGRATION: ${{ needs.plan.outputs.integration }}
        run: |
          [[ "$PLAN" == success && "$SAFETY" == success ]]
          [[ "$ANY" != true || "$SERVICE" == success ]]
          [[ "$NEED_INTEGRATION" != true || "$INTEGRATION" == success ]]

  deploy:
    name: Build release images and deploy
    needs: [plan, checks]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.checks.result == 'success' && needs.plan.outputs.any == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: resume-do-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check deployment access and latest main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.RESUME_DO_DEPLOY_HOST }}
          REGISTRY_PASSWORD: ${{ secrets.RESUME_DO_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOST" ]]; then
            echo 'CI passed. Deployment is not connected: run scripts/setup-cicd.sh.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          : "${REGISTRY_PASSWORD:?Configure RESUME_DO_REGISTRY_PASSWORD before deploying}"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi
      - name: Recreate the checked release plan
        env:
          BASE: ${{ needs.plan.outputs.base }}
          FULL: ${{ inputs.full || false }}
        run: |
          args=()
          if [[ "$FULL" == true ]]; then args+=(--full); fi
          python3 scripts/plan-release.py --base "$BASE" "${args[@]}" --output "$RUNNER_TEMP/plan.json"
      - name: Package source for domestic server build and registry publication
        if: steps.current.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 scripts/package-release.py --source --plan "$RUNNER_TEMP/plan.json" \
            --release "$release" --output "$RUNNER_TEMP/resume-release.tar"
      - name: Upload and deploy over verified SSH
        if: steps.current.outputs.deploy == 'true'
        env:
          RESUME_DO_REGISTRY_PASSWORD: ${{ secrets.RESUME_DO_REGISTRY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.RESUME_DO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.RESUME_DO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.RESUME_DO_DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.RESUME_DO_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.RESUME_DO_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_USER:?Missing deployment user}"
          : "${DEPLOY_KEY:?Missing deployment SSH key}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing verified host fingerprint}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$DEPLOY_PORT > 0 && 10#$DEPLOY_PORT <= 65535))
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/resume-ssh.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$scratch/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$scratch/known_hosts"
          options=(-i "$scratch/key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$scratch/known_hosts"
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=10
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          echo "Uploading source release ($(stat -c %s "$RUNNER_TEMP/resume-release.tar") bytes)"
          scp -v "${options[@]}" -P "$DEPLOY_PORT" "$RUNNER_TEMP/resume-release.tar" \
            "$remote:/home/ubuntu/resume-do/incoming/$release.tar"
          echo 'Source upload complete; building and publishing through domestic mirrors on server.'
          { printf '%s\n' "$RESUME_DO_REGISTRY_PASSWORD"; cat scripts/deploy-cloud.sh; } | \
            ssh "${options[@]}" -p "$DEPLOY_PORT" "$remote" \
              "IFS= read -r RESUME_DO_REGISTRY_PASSWORD; export RESUME_DO_REGISTRY_PASSWORD; bash -s -- '$release' /home/ubuntu/resume-do"
          echo "Deployed $GITHUB_SHA. SSH tunnel endpoint: http://localhost:8081" >> "$GITHUB_STEP_SUMMARY"
