        - sidebar

    ResumeDocument:
      type: object
      description: |
        简历文档。请求可只提交业务字段，服务端会补全缺失文本字段（空字符串）、
        默认布尔值并清洗正文 HTML；响应中的字段为补全后的规范结构。
      required: [schemaVersion, basic, intent, sections]
      properties:
        schemaVersion:
          type: integer
          const: 1
          description: 当前固定为 1
        importWarning:
          type: string
          maxLength: 500
          description: 导入解析警告，仅导入生成的文档可能带有
        moduleDefaultsApplied:
          type: boolean
          description: 是否已合并默认模块；为 true 后删除的模块不会在再次打开时自动加回
        basic:
          $ref: "#/components/schemas/ResumeBasic"
        intent:
          $ref: "#/components/schemas/ResumeIntent"
        sections:
          type: array
          maxItems: 30
          description: 模块列表；模块 ID 不可重复，全简历纯文本不超过 100000 字符
          items:
            $ref: "#/components/schemas/ResumeSection"

    ResumeBasic:
      type: object
      description: 基本信息。未提供的文本字段会补为空字符串，照片为空时省略展示。
      properties:
        name:
          type: string
          maxLength: 50
          default: ""
        gender:
          type: string
          maxLength: 10
          default: ""
        city:
          type: string
          maxLength: 50
          default: ""
        phone:
          type: string
          maxLength: 30
          default: ""
        email:
          description: 空字符串或合法邮箱（≤ 120）
          oneOf:
            - const: ""
            - type: string
              format: email
              maxLength: 120
        experienceYears:
          type: string
          maxLength: 30
          default: ""
        birthMonth:
          type: string
          pattern: '^$|^\d{4}-(0[1-9]|1[0-2])$'
          description: 出生年月，空或 `YYYY-MM`；填写后前端按当前月份自动计算年龄
        age:
          type: string
          maxLength: 30
          description: 原文年龄 / 无出生年月时的可编辑年龄
        nativePlace:
          type: string
          maxLength: 50
        ethnicity:
          type: string
          maxLength: 50
        maritalStatus:
          type: string
          maxLength: 50
        politicalStatus:
          type: string
          maxLength: 50
        height:
          type: string
          maxLength: 50
        weight:
          type: string
          maxLength: 50
        showPhoto:
          type: boolean
          default: true
          description: 是否在预览与编辑版导出中展示照片
        customFields:
          type: array
          maxItems: 20
          items:
            type: object
            required: [label, value]
            properties:
              label:
                type: string
                maxLength: 30
              value:
                type: string
                maxLength: 100
        photo:
          description: 内嵌照片（PNG / JPEG / WebP base64 Data URL），空字符串表示无照片
          oneOf:
            - const: ""
            - type: string
              maxLength: 400000
              pattern: '^data:image/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$'

    ResumeIntent:
      type: object
      properties:
        role:
          type: string
          maxLength: 100
          default: ""
        city:
          type: string
          maxLength: 50
          default: ""
        salary:
          type: string
          maxLength: 50
          default: ""
        arrival:
          type: string
          maxLength: 50
          default: ""

    ResumeSection:
      type: object
      required: [id, type, title, items]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,31}$"
          description: 模块 ID，小写字母开头，仅小写字母、数字、连字符
        type:
          type: string
          enum: [records, rich]
          description: "`records` 记录类；`rich` 纯正文类（最多 1 个条目）"
        title:
          type: string
          minLength: 1
          maxLength: 20
        visible:
          type: boolean
          default: true
        items:
          type: array
          maxItems: 30
          description: 记录类最多 30 条；正文类最多 1 条
          items:
            $ref: "#/components/schemas/ResumeRecordItem"
      allOf:
        - if:
            properties:
              type:
                const: rich
          then:
            properties:
              items:
                maxItems: 1

    ResumeRecordItem:
      type: object
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        title:
          type: string
          maxLength: 100
          default: ""
          description: 机构 / 项目名称
        role:
          type: string
          maxLength: 100
          default: ""
          description: 职位 / 角色
        startMonth:
          type: string
          pattern: '^$|^\d{4}-(0[1-9]|1[0-2])$'
          default: ""
        endMonth:
          type: string
          pattern: '^$|^\d{4}-(0[1-9]|1[0-2])$'
          default: ""
        ongoing:
          type: boolean
          default: false
          description: 至今；为 false 时开始年月不能晚于结束年月
        body:
          type: string
          maxLength: 20000
          default: ""
          description: |
            正文 HTML。服务端使用白名单清洗：
            允许 `p` `br` `strong` `b` `em` `i` `u` `ul` `ol` `li` `a`，
            `a` 仅保留 `href` / `rel` 且协议限 http/https/mailto；其余标签与属性会被移除。

    ResumeAppearance:
      type: object
      required: [themeColor]
      description: 版式配置；响应中为补全默认值后的完整对象。
      properties:
        templateId:
          $ref: "#/components/schemas/TemplateId"
          default: "1045"
        fontId:
          type: string
          enum: [sans, serif, arial]
          default: sans
        fontSize:
          type: integer
          minimum: 12
          maximum: 16
          default: 14
        lineHeight:
          type: number
          minimum: 1.2
          maximum: 2.2
          default: 1.5
        sectionGap:
          type: integer
          minimum: 5
          maximum: 50
          default: 18
        pageMargin:
          type: integer
          minimum: 24
          maximum: 60
          default: 42
        themeColor:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          default: "#1f5aa6"
          description: 主题色，必须为 `#RRGGBB`

    CreateResumeRequest:
      type: object
      required: [document, appearance]
      properties:
        title:
          type: string
          maxLength: 100
          description: 省略或空白时使用「我的简历」
        document:
          $ref: "#/components/schemas/ResumeDocument"
        appearance:
          $ref: "#/components/schemas/ResumeAppearance"

    UpdateResumeRequest:
      type: object
      required: [baseRevision, clientMutationId]
      description: "`title` / `document` / `appearance` 至少传一项。"
      properties:
        baseRevision:
          type: integer
          format: int64
          minimum: 0
        clientMutationId:
          type: string
          minLength: 1
          maxLength: 64
          description: 一次逻辑保存的幂等标识
        title:
          type: string
          maxLength: 100
        document:
          $ref: "#/components/schemas/ResumeDocument"
        appearance:
          $ref: "#/components/schemas/ResumeAppearance"

    CreateExportRequest:
      type: object
      required: [revision, idempotencyKey]
      properties:
        revision:
          type: integer
          format: int64
          description: 必须等于简历当前 revision
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 64
        filename:
          type: string
          maxLength: 120
          description: 省略时由姓名 + 意向职位生成；服务端会清洗并补 `.pdf`

    ExportStatus:
      type: string
      enum: [queued, rendering, ready, expired, failed]
      description: |
        `queued` 排队中；`rendering` 生成中；`ready` 可下载；
        `expired` 已过下载有效期；`failed` 生成失败（查看 errorCode）。

    ExportJob:
      type: object
      required: [id, status, filename, createdAt]
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        status:
          $ref: "#/components/schemas/ExportStatus"
        filename:
          type: string
          description: 下载文件名（已清洗并带 `.pdf`）
        downloadUrl:
          type: string
          description: 相对下载路径；仅 `ready` 时出现
        errorCode:
          type: string
          description: 失败或过期原因；worker 错误码或 `FILE_EXPIRED`
          enum:
            - CONTENT_OVERFLOW
            - INVALID_SNAPSHOT
            - TEMPLATE_VERSION_UNSUPPORTED
            - RENDERER_VERSION_UNSUPPORTED
            - MEASURE_FAILED
            - BROWSER_UNAVAILABLE
            - RENDER_TIMEOUT
            - RENDER_FAILED
            - FILE_EXPIRED
        errorMessage:
          type: string
          description: 可展示的错误原因
        expiresAt:
          type: string
          format: date-time
          description: 下载有效期；`ready` 后约 10 分钟
        createdAt:
          type: string
          format: date-time

    ImportStatus:
      type: string
      enum: [processing, ready, failed, confirmed, cancelled, expired]
      description: |
        `processing` 解析中；`ready` 草稿可用；`failed` 解析失败可重试；
        `confirmed` 已创建简历；`cancelled` 已放弃；`expired` 已过期。

    ImportDraft:
      type: object
      required: [title, document, appearance]
      properties:
        title:
          type: string
          maxLength: 100
        document:
          $ref: "#/components/schemas/ResumeDocument"
        appearance:
          $ref: "#/components/schemas/ResumeAppearance"

    ImportJob:
      type: object
      required: [id, filename, status, version, expiresAt]
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{32}$"
        filename:
          type: string
          description: 上传时的原始文件名
        status:
          $ref: "#/components/schemas/ImportStatus"
        sourceText:
          type: string
          description: 从文件提取的纯文本；确认 / 放弃 / 过期后省略
        draft:
          $ref: "#/components/schemas/ImportDraft"
        version:
          type: integer
          format: int64
          minimum: 0
          description: 草稿乐观锁版本；保存 / 确认 / 重试需匹配
        errorCode:
          type: string
          description: |
            `failed` 时的错误码，如 `SCANNED_PDF`、`UNSUPPORTED_FORMAT`、`PARSE_TIMEOUT`、
            `PARSE_INTERRUPTED`、`IMPORT_BUSY`
        message:
          type: string
          description: 可展示的说明。注意：`ready` 时该字段可能是解析警告，不是错误
        resumeId:
          type: string
          pattern: "^[a-f0-9]{32}$"
          description: 确认后创建的简历 ID
        expiresAt:
          type: string
          format: date-time
          description: 任务有效期（上传后 24 小时）

    ImportSaveRequest:
      type: object
      required: [version, draft]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        draft:
          $ref: "#/components/schemas/ImportDraft"

    ImportConfirmRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0

    AiRewriteAction:
      type: string
      enum: [polish, condense]
      description: "`polish` 润色；`condense` 精炼"

    AiRewriteRequest:
      type: object
      required: [requestId, action, text, privacyConsent]
      properties:
        requestId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          description: 一次逻辑操作的 UUID；24 小时内同 ID 同输入重放返回缓存
        action:
          $ref: "#/components/schemas/AiRewriteAction"
        text:
          type: string
          minLength: 1
          maxLength: 6000
          description: 纯文本，保留换行；不接受 HTML 与除换行/回车/Tab 外的控制字符
        section:
          type: string
          pattern: "^[a-z][a-z0-9_-]{0,31}$"
          description: 模块标识，如 work / project / skills / evaluation；不是提示词
        targetRole:
          type: string
          maxLength: 100
          description: 目标岗位，可选；不填则省略
        privacyConsent:
          type: boolean
          const: true
          description: 必须为 true，表示用户同意发送所选正文给 DeepSeek

    AiRewriteResponse:
      type: object
      required: [requestId, action, originalText, rewrittenText, warnings]
      properties:
        requestId:
          type: string
          description: 与请求一致的 UUID
        action:
          $ref: "#/components/schemas/AiRewriteAction"
        originalText:
          type: string
          description: 请求提交的原文
        rewrittenText:
          type: string
          description: 模型建议；前端按纯文本展示，采用前需用户确认
        warnings:
          type: array
          items:
            type: string
          description: 可展示的中文提示（非程序错误），如事实核对提醒
