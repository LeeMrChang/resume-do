server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 21m;

    # Keep the L1 error contract even when Nginx rejects the request first.
    location = /api/resumes/originals {
        error_page 413 =400 /_original_upload_too_large;
        proxy_pass http://resume-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/imports/direct {
        error_page 413 =400 /_original_upload_too_large;
        proxy_pass http://resume-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /_original_upload_too_large {
        internal;
        default_type application/json;
        charset utf-8;
        return 400 '{"code":"FILE_TOO_LARGE","message":"文件不能超过 20MB","details":{}}';
    }

    location /api/ {
        proxy_pass http://resume-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
